<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body {
            background: linear-gradient(120deg, #e3ffe9 0%, #a1c4fd 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .top-nav {
            background: linear-gradient(90deg, #2b5876 0%, #4e4376 100%);
            box-shadow: 0 6px 25px #2b587650;
            padding: 0 8vw 0 2vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.48em;
            font-weight: 700;
            color: #fbfbfb;
            letter-spacing: 2px;
            padding: 19px 0;
        }
        .nav-brand i {
            font-size: 2em;
            color: #64ffda;
        }
        .nav-links {
            display: flex;
            gap: 2.5vw;
        }
        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #faf9fd;
            font-weight: 550;
            font-size: 1.04em;
            letter-spacing: 1px;
            transition: color 0.19s, transform 0.18s;
            padding: 12px 10px 6px;
            border-radius: 11px 11px 0 0;
            position: relative;
        }
        .nav-link i {
            font-size: 1.7em;
            margin-bottom: 2px;
            color: #64ffda;
            transition: color 0.18s, transform 0.23s;
        }
        .nav-link:hover, .nav-link.active {
            color: #64ffda;
            background: rgba(76,201,240,0.10);
        }
        .nav-link:hover i, .nav-link.active i {
            color: #57aaff;
            transform: scale(1.11);
        }
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 28px;
        }
        .update-card {
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            box-shadow: 0 10px 44px 0px #41b8f644;
            padding: 42px 42px 35px 42px;
            margin-top: 42px;
            max-width: 460px;
            width: 98%;
            text-align: center;
            animation: cardfadein 0.6s;
        }
        @keyframes cardfadein {
            from { opacity: 0; transform: translateY(30px);}
            to   { opacity: 1; transform: translateY(0);}
        }
        .update-title {
            color: #3848d1;
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 13px;
        }
        .update-title i {
            color: #64ffda;
            font-size: 1.3em;
        }
        .update-desc {
            color: #12406a;
            font-size: 1.12em;
            margin-bottom: 28px;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.18em;
        }
        .input-row i {
            color: #64ffda;
            font-size: 1.21em;
        }
        .input-row input[type="text"] {
            flex: 1;
            padding: 10px 13px;
            font-size: 1.07em;
            border-radius: 10px;
            border: 1.5px solid #badbf7;
            background: #f7fcff;
            color: #2e5da8;
        }
        .input-row input:focus {
            border-color: #64ffda;
        }
        .update-btn {
            margin-top: 10px;
            width: 100%;
            padding: 13px 0;
            font-weight: 700;
            font-size: 1.10em;
            background: linear-gradient(90deg,#57aaff,#64ffda 80%);
            color: #fff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            letter-spacing: 0.4px;
            transition: background 0.27s;
            box-shadow: 0 6px 22px rgba(100,170,250,0.13);
        }
        .update-btn:hover {
            background: linear-gradient(90deg,#64ffda,#57aaff 100%);
        }
        .update-footer {
            margin-top: 2em;
            color: #70acd7;
            font-size: 1.02em;
        }
        .update-footer i { margin: 0 4px; color: #64ffda;}
        @media (max-width:800px) {
            .top-nav {flex-direction: column; gap: 2px; padding: 0 1.5vw;}
            .nav-links {gap: 15px;}
        }
        @media (max-width:600px) {
            .container {padding: 0 4px;}
            .update-card { padding: 18px 5px 12px 5px;}
            .top-nav {flex-direction: column; gap: 0; padding: 0;}
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">
            <i class="fas fa-server"></i>
            Group 8 IT Portal
        </div>
        <div class="nav-links">
            <a class="nav-link" href="insert.html" title="Insert">
                <i class="fas fa-database"></i>
                Insert
            </a>
            <a class="nav-link" href="search.html" title="Search">
                <i class="fas fa-search"></i>
                Search
            </a>
            <a class="nav-link active" href="update.html" title="Update">
                <i class="fas fa-code-branch"></i>
                Update
            </a>
            <a class="nav-link" href="delete.html" title="Delete">
                <i class="fas fa-times-circle"></i>
                Delete
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="update-card">
            <div class="update-title">
                <i class="fas fa-code-branch"></i>
                Update Registration
            </div>
            <div class="update-desc">
                <i class="fas fa-info-circle"></i> Enter the name you want to update.
            </div>
            <form action="update.php" method="POST">
                <div class="input-row">
                    <i class="fas fa-user"></i>
                    <input type="text" id="search_name" name="search_name" required placeholder="Enter Name to Update">
                </div>
                <button class="update-btn" type="submit"><i class="fas fa-code-branch"></i> Search</button>
            </form>
            <div class="update-footer">
                <i class="fas fa-sync"></i>
                Update your records easily
            </div>
        </div>
    </div>
</body>
</html>
